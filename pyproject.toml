[project]
name = "procbox"
version = "0.1.0"
description = "A playful pen for the apps running on your computer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "ProcBox contributors" }]
dependencies = [
    "PySide6-Essentials>=6.8",
    "psutil>=5.9",
    "shiboken6>=6.8",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
procbox = "procbox.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procbox"]

[tool.hatch.build.targets.wheel.force-include]
"src/procbox/platforms/bin/procbox-activity" = "procbox/platforms/bin/procbox-activity"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
